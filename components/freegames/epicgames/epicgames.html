<div class="card" id="epicFreeCard">
    <label class="section-label">Epic Free Games</label>

    <div class="epic-controls">
        <div class="epic-autoscan-row">
            <span class="epic-label">Auto-scan (daglig)</span>
            <label class="toggle-switch">
                <input type="checkbox" id="epicAutoScanToggle" />
                <span class="slider"></span>
            </label>
        </div>

        <span class="epic-last-scan" id="epicLastScan">Aldrig skannat</span>
    </div>

    <button class="btn-primary" id="epicScanBtn">Scan Epic</button>

    <div id="epicGamesList" class="epic-list"></div>

    <span class="scan-status" id="epicScanStatus">Status: Idle</span>
</div>
